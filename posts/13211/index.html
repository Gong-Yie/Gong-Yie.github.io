  <div class="article-body">
    <p>最近在研究Agent，也是我一直以来的一个疑惑  </p>
<p>目前主流Agent的设计都是将大模型拟人，去给大模型手脚，去以人的工作思路去工作。这确实一个值得探索的方向，就比如现在热门的具身机器人。但是我感觉不应该是这样，大模型的记忆能力，信息整合能力等等明显超过人类，以人类的思考方式反而限制了它。  </p>
<p>目前也只是我的一点想法，希望之后能有所研究，有所探索。</p>

  </div>
